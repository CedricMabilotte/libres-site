- Verger conservatoire de Secondigny
famille: lieu_non_marchand
resume: Verger conservatoire d'un hectare planté en 1995-1996 au lieu-dit La Guichetière, à Secondigny (Deux-Sèvres), sur une parcelle appartenant à la Maison familiale rurale de Frécul, par l'association des Croqueurs de pommes des Deux-Sèvres, fondée en 1990 et forte de 180 adhérents en 2020. Il réunit plus d'une centaine de variétés de pommes, dont une collection nationale de reinettes et les variétés de Gâtine (Reinette clochard). Tous les travaux, de la taille à la récolte et au pressage du jus, sont faits par les adhérents bénévoles. L'entrée est gratuite ; des séances de greffe sont offertes au public et aux scolaires. Le verger sert de parcelle de référence pour la surveillance sanitaire régionale.
