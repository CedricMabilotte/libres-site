dossier_juridique: 'Association de bénévoles ; aucun salarié mentionné. La production de jus de pommes (atelier « Doré de Gâtine ») et la remise de plants greffés « pour une somme modique » sont les seules cessions documentées ; leur régime n''est pas publié. Les plants de variétés anciennes cédés à des amateurs relèvent de l''article L. 661-8 du code rural depuis 2020. Aucune déclaration MSA, aucun rescrit ni reçu fiscal mentionnés. Relation sanitaire régulière : relevés hebdomadaires de pièges transmis à la FREDON.'
