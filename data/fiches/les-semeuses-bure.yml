dossier_juridique: 'Association immatriculée avec une activité agricole principale (01.13Z, culture de légumes) : elle se présente comme l''exploitante. Elle n''est pas « sans salarié » : en 2023, trois membres sont embauchés à temps partiel (un CDI, deux contrats aidés), cinq sont bénévoles ; le répertoire indique une tranche de 1 à 2 salariés. Les ventes se font à « prix libre et solidaire », avec une participation indicative calculée sur le coût réel de production. Trois membres préparent un baccalauréat professionnel agricole (conduite et gestion de l''entreprise agricole). Aucune source sur l''affiliation MSA. Contexte : forte présence des gendarmes autour de Bure, contrôles et procès des opposants entre 2016 et 2019.'
