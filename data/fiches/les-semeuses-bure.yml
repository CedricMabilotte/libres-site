resume: Collectif de maraîchage né à l'automne 2019 parmi les opposants au projet Cigéo d'enfouissement de déchets nucléaires, structuré en association à Mandres-en-Barrois (Meuse) en février 2020. En 2023, huit maraîchères et maraîchers cultivent environ trois hectares mis à disposition par un agriculteur voisin, avec une serre dans le jardin de la maison associative L'Augustine. Les légumes sont vendus à prix libre indicatif sur des marchés hebdomadaires et en paniers à Commercy et Nancy ; un bar et une cantine à prix libre se sont greffés sur la distribution. L'association emploie trois personnes à temps partiel, les cinq autres membres étant bénévoles.
