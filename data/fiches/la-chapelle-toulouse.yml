resume: Ancienne chapelle de Toulouse, investie en 1993 et devenue un lieu autogéré d'expérimentation
  sociale, culturelle et militante, sans salarié ni subvention. La Ville, qui a acquis le bâtiment au
  diocèse en 2009, a signé le 19 janvier 2018 avec l'association un bail emphytéotique de 40 ans assorti
  d'une promesse de vente conditionnée à la mise aux normes. Après sept ans de travaux, le lieu a été
  conforme ERP en janvier 2025 et environ 1 300 donateurs ont réuni 100 000 € pour le rachat. La mairie
  a retiré la délibération de vente en septembre 2025 puis annoncé en février 2026 une suspension de trois
  ans, contestant l'intérêt général de certaines activités.
