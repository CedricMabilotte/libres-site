portes:
  forme_civile:
    valeur: oui
    note: 'Association 1901 usagère, Ville de Toulouse propriétaire : aucun maillon commercial. Règle
      P1 (décision de Ced, 2026-10-01) : une personne publique propriétaire est admise au cas par cas,
      si le montage établit clairement un commun. Ici : bail long au profit d''une association usagère
      autogérée, sans salarié ni subvention, depuis 1993 — commun établi. Complément du 2026-11-20 : l''emphytéote
      est l''association La Chapelle (loi 1901, déclarée en préfecture le 12 septembre 2017, SIREN 833577000,
      RNA W313026794), créée pour cette opération, distincte de L''Atelier Idéal qui anime le lieu depuis
      1993 (sources 7 et 12).'
    source: 2
  foncier_verrouille:
    valeur: oui
    note: 'Bail emphytéotique de 40 ans signé le 19 janvier 2018 (≥ 30 ans). Fragilité : la mairie exige
      de démontrer la conformité de l''activité à l''objet du bail. Complément du 2026-11-20 : le bail
      (acte notarié du 19 janvier 2018, 40 ans, du 19 janvier 2018 au 18 janvier 2058, parcelle 826 AC
      102, articles L. 451-1 à L. 451-13 du Code rural) a été publié au service de la publicité foncière
      de Toulouse 1 le 16 février 2018, volume 2018P numéro 3283, selon l''exposé préalable de l''avenant
      annexé à la délibération 22-0750 (source 7) : le titre est opposable aux tiers, au-delà du « meilleur
      effort documentaire ». La pièce primaire (copie de la formalité ou état hypothécaire) n''a pas été
      vue. Le fonds reste dans le domaine privé de la Ville, libre de vendre (source 9) ; le projet d''acte
      de 2017 prévoit que le droit de l''emphytéote est cessible, hypothécable et saisissable (source
      6), clause à confirmer sur l''acte signé. Le verrou reste un verrou par titre : la promesse de vente
      est suspendue pour trois ans par la délibération 26-0006 du 6 février 2026 (source 10), option de
      nouveau ouverte du 6 février au 6 août 2029 sous réserve du constat d''une activité d''intérêt général.'
    source: 2
