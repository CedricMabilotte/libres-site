dossier_juridique: 'Modèle qui contourne la question : l''association ne se déclare pas exploitante ; elle porte
  le foncier et le loue à des paysans qui exercent chacun leur activité. La question de l''affiliation MSA se pose
  donc pour les paysans, pas pour l''association. Aucun contentieux connu. Cas de contraste pour le dossier « activité
  agricole en association ».'
