resume: Ferme maraîchère de Lépigny, à Domancy (Haute-Savoie), cultivée depuis 2005. Quand la propriétaire annonce
  en 2014 son intention de vendre, un collectif citoyen crée en août 2018 l'association Ferme associative du Pays
  du Mont-Blanc, soutenue par la Confédération paysanne de Haute-Savoie, qui achète le lieu en mai 2019 grâce à
  un financement participatif ; le terrain a été payé à 80 % par des dons de citoyens, d'entreprises, d'associations
  et de collectivités. L'association loue les terres et deux appartements à des paysans installés (légumes, verger,
  apiculture, semences), entretient le lieu, tient des jardins partagés pour ses adhérents et organise des fêtes
  publiques.
