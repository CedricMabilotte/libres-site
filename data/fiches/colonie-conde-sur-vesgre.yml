famille: communaute_intentionnelle
resume: 'Première tentative fouriériste (1832) sur 460-480 ha apportés ou achetés par J.-A. Devay et A.
  Baudet-Dulary, portée par une société anonyme par actions ; liquidée le 24 avril 1836, les terres retournant
  à leurs propriétaires. Après la Société des Cartonniers (1846-1859), le Ménage sociétaire, locataire
  depuis 1850, rachète en 1860 un domaine de 34 ha et le place dans une société civile immobilière à parts.
  Le lieu existe toujours : une association loi 1901, le Ménage sociétaire, y réunit des familles sociétaires
  qui l''occupent surtout en fin de semaine et en vacances.'
