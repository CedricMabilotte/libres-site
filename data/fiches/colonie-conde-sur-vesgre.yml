portes:
  forme_civile:
    valeur: non
    note: 'Société anonyme par actions (1832), puis société civile immobilière à parts (1860) versant
      un dividende (10 F par part en 1870) ; parts de société civile cessibles (art. 1861 C. civ.). Maillon
      faible : le porteur du foncier.'
    source: 2
  foncier_verrouille:
    valeur: non
    note: 'Aucune inaliénabilité : terres rendues aux propriétaires en 1836, dissolution forcée de la
      Société des Cartonniers et mise en vente en 1859 ; depuis 1860 propriété d''une société à parts.'
    source: 2
  usage_ig:
    valeur: non
    note: 'Usage résidentiel et de loisir des membres (week-ends, vacances) : cercle restreint.'
    source: 3
  autogestion:
    valeur: partiel
    note: Assemblée générale des sociétaires (1860) et statuts donnant « une importance égale à tous les
      sociétaires » ; mais droits liés à la détention de parts, et fonctionnement actuel non documenté.
    source: 2
  etabli:
    valeur: oui
    note: Usage continu par le Ménage sociétaire depuis 1850 (locataire) puis 1860 (propriétaire via la
      SCI) ; rupture 1836-1840 après la liquidation initiale.
    source: 2
chronologie:
- annee: 1832
  evenement: Souscription du journal Le Phalanstère ; fondation de la Colonie sociétaire sur 460-480 ha
    (société anonyme au capital de 1 200 000 F).
  source: 2
- annee: 1836
  evenement: '24 avril : dissolution ; les terres retournent à Devay et Baudet-Dulary.'
  source: 2
- annee: 1846
  evenement: Baudet-Dulary détache 34 ha ; Société des Cartonniers ; bâtiment principal achevé en 1848.
  source: 2
- annee: 1850
  evenement: Des sociétaires prennent la propriété à bail et fondent le Ménage sociétaire.
  source: 2
- annee: 1859
  evenement: Dissolution forcée de la Société des Cartonniers (tribunal de Mantes) ; mise en vente.
  source: 2
- annee: 1860
  evenement: Acquisition des 34 ha par le Ménage sociétaire (22 juillet) ; société civile immobilière
    (statuts du 11 novembre).
  source: 2
- annee: 1870
  evenement: 327 parts de 200 F détenues par 120 actionnaires, dividende de 10 F par part.
  source: 2
fiabilite:
  verifie:
  - Chronologie 1832-1878 (Duizabo 2003, d'après le rapport Morellet de 1870).
  - Association loi 1901 éditrice du site (mentions légales).
  - Domaine actuel de 35 ha (site officiel).
  non_confirme:
  - Que la SCI de 1860 soit encore le porteur du foncier aujourd'hui (le site évoque « deux structures
    juridiques » sans les nommer).
  - Régime actuel de cessibilité des parts (clause d'agrément ?).
  - 'Surface : 460 ha selon Wikipédia, 480 ha (109 + 351) selon Duizabo pour 1832.'
