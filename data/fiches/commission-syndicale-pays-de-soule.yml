famille: commun_foncier
resume: Estives, pâturages et forêts indivis entre 43 communes de Soule (Pays basque), gérés en commun depuis la création de la commission syndicale en juin 1838, en application de la loi de juillet 1837, sur des terres régies par la coutume de Soule de 1520. Le territoire couvre 14 132 hectares, entre 600 et 2 017 mètres, pour moitié pâturages et pour moitié forêts. En 2018, 232 éleveurs y estivaient près de 6 000 unités de bétail autour de 43 cayolars, cabanes pastorales tenues en indivision par des sociétés d'éleveurs. La commission emploie 19 équivalents temps plein et gère aussi 35 chalets locatifs à Iraty.
