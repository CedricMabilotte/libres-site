dossier_juridique: 'Biens indivis entre communes : CGCT, art. L. 5222-1 et suivants (issus de la loi de 1837), personne morale de droit public administrée par une commission syndicale de délégués des conseils municipaux, présidée par un syndic. Les éleveurs peuvent s''organiser en groupements pastoraux (C. rur., art. L. 113-3 : société, association, syndicat ou GIE, agrément préfectoral, durée minimale de neuf ans) ; ils restent individuellement exploitants affiliés à la MSA. Les droits d''usage (pacage, affouage, soutrage) relèvent du code civil (art. 625 et suivants, cités par la commission).'
