resume: 'Marcel Barbu installe en 1941 à Valence, dans une ancienne vinaigrerie, un atelier de boîtiers
  de montres qu''il abandonne à la communauté : la Communauté de travail Marcel Barbu est fondée le 14
  janvier 1943, prend le nom de Boimondau en 1947 et le statut de SCOP « à forme communautaire » en 1948.
  Une assemblée générale élit pour trois ans un chef de communauté doté du pouvoir exécutif ; la rémunération
  suit un barème, et la communauté développe coopérative de consommation, logements, colonie de vacances,
  ciné-club. Barbu part en 1946, Marcel Mermoz en 1951, la Règle est suspendue en 1958. En cessation de
  paiement en avril 1971, la SCOP est liquidée par le tribunal de Romans en septembre 1971.'
