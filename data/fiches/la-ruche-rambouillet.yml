famille: lieu_non_marchand
resume: École libertaire fondée par Sébastien Faure, qui loue en janvier 1904 un domaine agricole d'environ
  25 ha au lieu-dit Le Pâtis, à l'entrée de Rambouillet (alors Seine-et-Oise). Une quarantaine d'enfants
  de familles pauvres ou orphelins y sont accueillis gratuitement par des éducateurs bénévoles. Le lieu
  vit des conférences de Faure (environ 75 % des recettes), de dons et de ses productions (miel, laitages,
  légumes, imprimerie). La mobilisation de 1914 le prive de ses collaborateurs et de ses ressources ;
  il ferme en février 1917.
