resume: Ferme de Mont-Saint-Aignan, près de Rouen, achetée en 2012 par Immochan, filiale immobilière d'Auchan,
  pour un projet commercial, et occupée à partir de décembre 2012. Portée par l'Association de protection
  de la ferme des Bouillons, l'occupation y développe maraîchage biologique, marché hebdomadaire, AMAP,
  conférences et fêtes ; le terrain est reclassé en zone naturelle en 2014. Le 18 août 2015, la SAFER
  écarte le projet d'achat collectif et valide la vente à une SCI familiale ; le lieu est évacué le 19
  août 2015. L'association poursuit ses activités ailleurs. L'occupation n'a jamais été régularisée.
