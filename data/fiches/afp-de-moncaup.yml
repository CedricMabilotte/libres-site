famille: commun_foncier
resume: Association foncière pastorale créée en 1976 à Moncaup (Comminges, Haute-Garonne), l'une des toutes premières de France avec celle de la commune voisine d'Arguenos, quatre ans après la loi pastorale de 1972. Elle regroupe environ 80 propriétaires sur 90 hectares pour remédier au morcellement des terres de montagne, et peut donner ses terres à bail à des groupements pastoraux. Quatre exploitants y sont enregistrés ; un groupement pastoral commun à Moncaup et Arguenos, dit du Mont Calem, mène les troupeaux vers les estives du Calem.
