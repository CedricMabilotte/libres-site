dossier_juridique: 'AFP : C. rur., art. L. 135-1 et suivants (loi n° 72-12 du 3 janvier 1972, art. 2) : associations syndicales de propriétaires régies par l''ordonnance n° 2004-632 ; celles qui sont autorisées ou constituées d''office sont des établissements publics. Elles aménagent et gèrent les fonds et peuvent les donner à bail à des groupements pastoraux (art. L. 113-3 : forme de société, d''association, de syndicat ou de GIE, agrément du préfet, durée minimale de neuf ans). Les membres du groupement qui élèvent sont des exploitants affiliés individuellement à la MSA ; l''AFP elle-même n''exploite pas.'
