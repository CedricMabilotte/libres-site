famille: communaute_intentionnelle
resume: Ferme de 23 ha à Vitrolles-en-Luberon (Vaucluse), acquise en 1993 par le réseau Longo Maï pour produire du vin destiné à sa caisse commune. En 2023, 18 personnes dont 4 enfants y vivent, entièrement prises en charge par l'association, sans salaire ; 8 ha de vignes donnent environ 12 000 bouteilles de vin nature par an, vendues au prix du marché, à côté du maraîchage, des céréales, de l'élevage et de la transformation pour l'autoconsommation. Les ventes couvrent environ la moitié du budget, le reste venant d'une fondation suisse de soutien. Le collectif participe à la défense de la Zone à patates de Pertuis et accueille des personnes exilées. Une société civile « SCA Cabrery », créée fin 1992, a été radiée en septembre 2026.
