dossier_juridique: 'Production viticole marchande (environ 12 000 bouteilles par an au prix du marché, vente à la ferme, sur les marchés, chez des cavistes ; une tonne de raisin vendue à une coopérative) par un collectif présenté comme associatif et sans salaire. Aucune source sur l''affiliation MSA, la déclaration de récolte ou le régime fiscal ; aucune association du réseau n''a été trouvée au répertoire Sirene à Vitrolles-en-Luberon. La société civile « SCA Cabrery » (location de terrains) créée en décembre 1992 a été fermée au répertoire le 24 septembre 2026 : piste d''un transfert du foncier, à vérifier aux hypothèques. En 2023, la Cabrery et le Mas de Granier étudiaient le statut OACAS pour faciliter la régularisation de personnes accueillies.'
