fiabilite:
  verifie:
  - 23 ha dont 8 ha de vignes, 18 habitants, caisse commune, part des ventes passée d'environ 60 % à 50 % du budget entre 2014 et 2020 (Silence, 2023)
  - Consensus et refus du salariat (site de la coopérative)
  - Société civile créée en 1992, fermée en 2026 (répertoire Sirene)
