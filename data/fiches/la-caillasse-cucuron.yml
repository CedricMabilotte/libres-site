resume: Collectif né en 2018 à Cucuron (Vaucluse), sur les coteaux sud du Luberon, qui cultive bénévolement environ
  un hectare d'oliveraie, un hectare de maraîchage et cinq hectares de vignes lors de chantiers collectifs deux
  à trois fois par mois. L'huile est partagée entre bénévoles, les légumes sont donnés en soutien à des luttes,
  la vente du vin couvre les charges. Les parcelles ont d'abord été mises à disposition de manière informelle ;
  une partie de l'oliveraie est acquise après une levée de fonds en 2023. L'association a été transformée en SCOP
  (SARL) immatriculée au RCS en février 2025, les membres souhaitant se rémunérer.
