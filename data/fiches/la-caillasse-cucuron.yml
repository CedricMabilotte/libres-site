dossier_juridique: 'Cas d''un refus administratif puis d''une admission : selon un membre, « la personne de la Mutualité
  sociale agricole ne voulait pas nous enregistrer en tant qu''association » ; il a fallu la mettre en relation
  avec la caisse de Rouen, où une ferme collective associative était déjà déclarée, pour qu''elle admette que c''était
  possible. Le collectif signale aussi que l''aide bénévole à des agriculteurs est regardée comme du travail dissimulé.
  Aucun contentieux publié. La transformation en SCOP (2025) sort le cas du droit civil non lucratif.'
