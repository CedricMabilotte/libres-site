resume: Ancienne ferme du Centre-Bretagne (Morbihan), acquise en 2017 et transmise au fonds de dotation Antidote
  en novembre 2024, après plusieurs années de travail pour la sortir de la propriété privée. Le lieu autogéré cherche
  à créer entraide et lien social pour des personnes isolées ou marginalisées en milieu rural, et offre mise au
  vert, rencontres politiques et chantiers collectifs, souvent en mixité choisie. Le collectif rénove la ferme en
  chantiers participatifs, mène des activités agricoles non marchandes et se réunit en assemblée à chaque saison,
  avec des commissions.
