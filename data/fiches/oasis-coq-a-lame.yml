uid: oasis-coq-a-lame
nom: Oasis du Coq à l'Âme
autres_noms:
- Domaine d'Echoisy
famille: communaute_intentionnelle
resume: 'Écolieu installé fin 2021 sur le domaine d''Echoisy, à Cellettes (Charente), par une vingtaine
  de foyers. Le foncier appartient à une SCIC (société coopérative d''intérêt collectif), financée par
  des apports des membres en comptes courants d''associés remboursables sur vingt-cinq ans ; l''usage
  est confié à l''Association des habitants du domaine d''Echoisy, à côté de l''association historique
  du projet. Membre de la Coopérative Oasis, le lieu a signé le 28 août 2025, avec son appui, une obligation
  réelle environnementale de 99 ans. Épreuve de référence : porteur foncier coopératif et installation
  trop récente.'
