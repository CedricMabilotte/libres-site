famille: commun_foncier
resume: 'Domaine agricole et naturel de 130 ha au hameau de Lachaud, à Gentioux-Pigerolles (Creuse), sur
  le plateau de Millevaches, acquis en 2008 par la Communauté de communes du Plateau de Gentioux avec
  l''association Le Champ des Possibles et le conservatoire régional des espaces naturels. Le conservatoire
  tient 75 ha de landes et tourbières par bail emphytéotique signé le 5 octobre 2010 ; les terres agricoles
  ont été louées au GAEC de la Fève, installé en avril 2008 (brebis limousines), aujourd''hui radié. Le
  hameau accueille aussi l''association Le Champ des Possibles, l''espace-test agricole Paysan Dès Demain
  (2013) et des habitants, artisans et chercheurs. Épreuve de référence : foncier public et gestion conservatoire
  civile, mais usage agricole par des exploitants sociétaires ou individuels.'
