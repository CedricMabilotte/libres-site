portes:
  forme_civile:
    valeur: partiel
    note: Depuis 1984, association loi 1901 propriétaire et gestionnaire (oui) ; de 1894 à 1984, coopérative
      constituée en société anonyme à actions (non). Lecture de la trajectoire au maillon faible.
    source: 2
  foncier_verrouille:
    valeur: partiel
    note: Aucune inaliénabilité statutaire ; dévolution non lucrative pour les membres mais ouverte aux
      sociétés coopératives.
    source: 2
  usage_ig:
    valeur: oui
    note: Centre culturel ouvert à toutes et tous, mission qualifiée de service public, agrément d'éducation
      populaire.
    source: 2
  autogestion:
    valeur: partiel
    note: Assemblée générale des adhérents souveraine en droit, gestion par un conseil d'administration
      et une équipe salariée ; le public n'est pas membre de droit.
