famille: lieu_non_marchand
resume: Coopérative d'alimentation, de production et de prévoyance fondée en 1881 par le Cercle ouvrier
  de Saint-Claude. Elle achète en 1894 la maison Dumoulin, 12 rue de la Poyat, et construit en 1908-1910
  la Maison du Peuple (commerces, imprimerie, théâtre-cinéma, bibliothèque, bourse du travail). En 1965
  elle fusionne avec d'autres coopératives pour former Les Coopérateurs du Jura. Le 22 mai 1984, à la
  fusion de ceux-ci dans l'Union des coopérateurs, ses administrateurs créent l'association loi 1901 La
  fraternelle et lui apportent la propriété de la Maison du Peuple. L'association y gère depuis un centre
  culturel d'éducation populaire ouvert au public.
