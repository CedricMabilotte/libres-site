resume: 'Ferme d''élevage ovin laitier de moyenne montagne à La Sure en Chartreuse (ancienne commune de
  Pommiers-la-Placette, Isère). Depuis janvier 2016, elle est exploitée par un GAEC de deux associés (brebis,
  fromages et yaourts biologiques, apiculture). En 2018, la Fondation Terre de Liens a acquis par collecte
  de dons 6 ha de prairie attenants, présentés comme « une première étape » de préservation de la ferme.
  Épreuve de référence : le porteur (fondation reconnue d''utilité publique, et non la Foncière commerciale)
  est de droit civil, mais l''usage est celui d''une exploitation agricole sociétaire, titulaire d''un
  bail rural.'
