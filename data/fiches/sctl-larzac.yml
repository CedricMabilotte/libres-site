nom: Société civile des terres du Larzac (SCTL)
autres_noms:
- SCTL
- Terres du Larzac
famille: commun_foncier
resume: 'Après l''abandon en 1981 du projet d''extension du camp militaire du Larzac, l''État conserve
  les terres rachetées et en confie la gestion aux habitants : la Société civile des terres du Larzac,
  constituée en assemblée le 29 novembre 1984, signe le 29 avril 1985 un bail emphytéotique de soixante
  ans sur quelque 6 300 hectares, prolongé par avenant en 2013 jusqu''au 30 avril 2083. Ses associés sont
  les fermiers et résidents ; la moitié des parts plus une doit être détenue par les associés exploitants.
  Un conseil de gérance de onze membres attribue les exploitations par baux ruraux « de carrière » et
  prêts à usage ; les seules recettes sont les fermages.'
