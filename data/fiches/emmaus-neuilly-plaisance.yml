resume: En octobre 1947, l'abbé Pierre et Lucie Coutaz s'installent au 38 avenue Paul-Doumer à Neuilly-Plaisance,
  maison qu'ils aménagent en auberge de jeunesse baptisée Emmaüs. En 1949, la rencontre avec Georges Legay,
  premier compagnon, en fait un lieu d'accueil inconditionnel où les compagnons vivent de la récupération
  et de la revente d'objets. Le mouvement s'étend (terrain de Champs-Fleuris en 1950, site de Neuilly-sur-Marne),
  l'association Emmaüs est créée en 1954. Les communautés de Neuilly-Plaisance et Neuilly-sur-Marne fusionnent
  en 2011 sous le nom de Neuilly Emmaüs Avenir, organisme d'accueil communautaire (OACAS) d'environ 80
  compagnons.
