resume: 'Ancienne maison, grande grange et dépendances sur les causses du Quercy, à Bio (Lot), acquises à partir
  de 2019 dans le sillage de la reprise d''une ferme voisine par Terre de Liens. Une dizaine de personnes actives
  y font vivre un lieu partagé et autogéré : stages, rencontres, réunions, hébergements ponctuels. La collecte d''Antidote
  (plus de 200 000 € pour un objectif de 215 000 €) désigne le fonds comme « acheteur et futur propriétaire », l''usage
  étant confié à l''association par bail emphytéotique.'
