resume: 'Écohameau créé en 2009 sur un domaine agricole de 46 ha à Gensac-de-Boulogne (Haute-Garonne),
  où vivent une vingtaine d''adultes et une vingtaine d''enfants dans un habitat autoconstruit. Le lieu
  est acquis et administré par la SCI Terres d''Ecolectif (2012), dont l''association collégiale Chemins
  d''Ecolectif détient 90 % des parts et la société M.V. Finances 10 % ; l''association, qui décide «
  à zéro objection », anime le lieu, et la SCI perçoit des loyers. Membre du réseau de la Coopérative
  Oasis. Épreuve de référence : société civile à parts avec un associé commercial.'
