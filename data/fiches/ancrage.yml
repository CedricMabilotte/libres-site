resume: Immeuble de quatre étages (environ 360 m²) dans le quartier des Trois Maisons, à Nancy, acheté en 2022 par
  le collectif Ancrage, né d'une lutte de quartier contre la gentrification, grâce à des dons, des subventions de
  fondations, des prêts privés et un emprunt bancaire. On y trouve trois logements, un atelier d'imprimerie, une
  bibliothèque féministe, une zone de gratuité, des repas solidaires et un espace d'éducation populaire. Le lieu
  fonctionne sur le bénévolat et des relations non marchandes ; le portage par le fonds Antidote est annoncé mais
  aucun transfert n'est documenté.
