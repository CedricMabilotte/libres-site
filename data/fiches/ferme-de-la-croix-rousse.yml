dossier_juridique: Les fermes pédagogiques n'ont pas de statut législatif ; l'étude préalable du projet renvoie à la circulaire interministérielle du 5 avril 2001 et distingue la ferme d'animation de l'exploitation agricole. Sans vente régulière ni revenu professionnel, la cotisation de solidarité n'est pas due (art. D. 731-34, voir R1) ; l'élevage reste soumis aux règles sanitaires (détention de volailles, ruchers).
