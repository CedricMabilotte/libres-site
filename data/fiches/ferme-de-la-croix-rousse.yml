resume: 'Ferme d''animation pédagogique urbaine sur le plateau de la Croix-Rousse (Lyon 4e), née d''un groupe de travail du conseil de quartier Croix-Rousse Ouest en 2015. L''association est constituée en mai 2017 ; une convention d''un an avec la Ville de Lyon (juin 2018) puis une convention de six ans (12 mars 2021) lui ouvrent un terrain de 6 691 m² et un bâtiment rénové. Poules, ruches, potager, mare et compost y sont tenus par des bénévoles, sans visée de production : l''objet statutaire est l''éducation à l''environnement par l''élevage et la culture en ville.'
