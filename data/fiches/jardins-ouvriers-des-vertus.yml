dossier_juridique: 'Volet agricole : les jardins familiaux sont la catégorie légale d''une culture collective sans
  chef d''exploitation, à l''exclusion de tout usage commercial (code rural, art. L. 561-1 et suivants) ; le cadre
  ne protège pas le foncier. Volet contentieux : CAA Paris, 10 février 2022, n° 21PA02476, annulation du refus de
  Plaine Commune de modifier le PLUi et injonction de ne classer en zone urbaine que la part strictement nécessaire
  à la gare et au centre nautique ; CAA Paris, 25 avril 2024, n° 23PA02768, rejet de la requête de la société des
  Jardins des Vertus et d''Environnement 93 contre la modification du 11 avril 2023. Tribunal judiciaire de Bobigny,
  16 septembre 2022 : relaxe de huit militants poursuivis pour entrave à des travaux publics.'
