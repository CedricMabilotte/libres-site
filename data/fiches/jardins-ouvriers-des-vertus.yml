famille: commun_foncier
resume: Jardins familiaux d'Aubervilliers, sur le glacis du fort, fondés le 29 novembre 1935 par la Société des
  jardins ouvriers des Vertus, dernière trace des cultures maraîchères de la plaine des Vertus. Environ 2,6 ha de
  parcelles cultivées pour les besoins des jardiniers. Intégrés depuis 2014 à la ZAC du Fort d'Aubervilliers portée
  par Grand Paris Aménagement, ils sont amputés en 2021 pour les abords d'une piscine d'entraînement olympique,
  malgré une occupation de plusieurs mois (« Jardins à défendre »), puis menacés par le chantier d'une gare de la
  ligne 15. Deux arrêts de la cour administrative d'appel de Paris (2022, 2024) encadrent la part des jardins classée
  en zone urbaine.
