famille: communaute_intentionnelle
resume: Écolieu collectif rural du Béarn, à Méracq, issu d'un groupe écovillage né en 2006-2007 près d'Oloron ;
  le lieu est acheté à l'été 2015 et investi en octobre 2015. Une maison, des granges, 11 ha de prairie et de bois,
  trois serres, un potager et un verger, des ânes, moutons, chèvres, abeilles et poules. Les activités agricoles
  vivrières sont portées par le groupe, les activités professionnelles par une personne. Une SCI (une part de 2
  000 € par sociétaire) possède le lieu et le loue par bail rural de 25 ans à l'association Ferme Légère, dont les
  résidents sont bénévoles et vivent de revenus extérieurs.
