dossier_juridique: 'Montage dissocié : la SCI propriétaire donne à bail rural de 25 ans le lieu à l''association,
  qui porte les activités agricoles vivrières avec des résidents bénévoles ; une activité agricole professionnelle
  éventuelle est portée par une personne. Le bail rural suppose un preneur exploitant : la qualité d''exploitant
  de l''association au regard de la MSA et du contrôle des structures n''est pas documentée. Aucun contentieux connu.'
