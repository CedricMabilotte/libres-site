famille: communaute_intentionnelle
resume: Premier « milieu libre » anarchiste en France, préparé en 1902 à Paris par une Société pour la
  création et le développement d'un milieu libre (environ 250 co-sociétaires fin 1902). À Vaux, hameau
  d'Essômes-sur-Marne, Alphonse Boutin vend deux maisons à la société et met deux hectares à disposition,
  à condition de participer. La colonie se constitue en février 1903 en société coopérative « Le Milieu
  libre » ; Georges Butaud et Sophia Zaïkowska l'animent. Dès juillet 1903, Boutin se retire et reprend
  son apport ; la colonie loue 10 ha à Bascon. Réduite à sept personnes fin 1905, elle se dissout en février
  1907.
