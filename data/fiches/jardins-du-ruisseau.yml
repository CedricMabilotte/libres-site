dossier_juridique: 'Les jardins partagés n''ont pas de statut légal. La proposition de loi relative aux jardins collectifs adoptée par le Sénat le 14 octobre 2003 les définissait (jardins « créés ou animés collectivement, ayant pour objet de développer des liens sociaux de proximité ») et leur donnait un bail d''au moins trois ans avec préavis de six mois ; aucun texte promulgué correspondant n''a été trouvé. Le cadre effectif est contractuel : convention avec la collectivité et, à Paris, charte Main Verte. Aucune vente : pas de revenu professionnel, donc pas de cotisation de solidarité MSA (art. D. 731-34, voir R1).'
