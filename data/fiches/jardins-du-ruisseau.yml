resume: 'Jardin partagé d''environ 1,5 hectare sur le quai et les talus de l''ancienne Petite Ceinture, porte de Clignancourt (Paris 18e). Proposé dès 1998 par des riverains, porté à partir d''octobre 2000 par une association, le projet obtient l''accord de la SNCF, de l''État et de la Ville et les jardins sont inaugurés en juin 2004. Le terrain appartient à SNCF Réseau ; la Ville de Paris le loue, l''a aménagé et en a confié la gestion exclusive à l''association par convention. Rucher, poulailler, vigne, mare, compost, accueil des écoles : l''un des premiers jardins partagés parisiens, adhérent de la charte Main Verte.'
