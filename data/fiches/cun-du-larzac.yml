nom: Le Cun du Larzac
autres_noms:
- Cun
famille: lieu_non_marchand
resume: En 1975, pendant la lutte du Larzac contre l'extension du camp militaire, quatre objecteurs de
  conscience insoumis occupent illégalement une maison appartenant à l'armée, près de Millau. Après une
  réinstallation précaire, le Cun s'implante légalement en 1981 dans un habitat construit pour le projet
  et devient un lieu d'accueil, de formation à la non-violence et d'expériences écologiques. Après des
  crises financières au milieu des années 1990, l'association est liquidée (2001) puis réorganisée (2002)
  en lieu d'accueil pour des associations adhérentes ; une SCI du Cun gère les locations et a signé en
  2008 un bail de 40 ans avec l'association Champs du Monde. Un éco-camping y est exploité par une SARL
  coopérative.
