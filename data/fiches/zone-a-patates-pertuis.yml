famille: occupation_regularisee
resume: Occupation agricole et d'habitat menée de novembre 2021 à juin 2022 à Pertuis (Vaucluse) contre l'extension d'une zone d'activités menaçant 86 ha de terres irriguées de la plaine de la Durance. Après des mises en culture répétées depuis 2019, des militants occupent quatre maisons promises à la démolition et plantent une parcelle d'environ un hectare, dont 200 arbres fruitiers, en lien avec l'association Terres vives Pertuis, la Confédération paysanne et d'autres collectifs. L'établissement public foncier, mandaté par la Métropole et la Ville, obtient l'expulsion ; une quinzaine de personnes sont expulsées le 28 juin 2022, les cabanes détruites et les maisons murées. Aucune régularisation n'a eu lieu.
