dossier_juridique: 'Activité agricole sans aucun cadre : cultures de pommes de terre et plantation d''arbres fruitiers par un collectif de fait sans titre, non déclarée. Le contentieux porte sur l''occupation des maisons : l''établissement public foncier, mandaté par la Métropole et la Ville, demande l''expulsion devant le juge du pôle de proximité de Pertuis (6 janvier 2022), qui accorde un délai jusqu''à la fin de la trêve hivernale ; occupants expulsables le 4 avril, expulsés le 28 juin 2022, menottés puis relâchés sans garde à vue. Un membre de la Cabrery rapporte en 2023 que la zone figurait parmi la quinzaine de sites les plus surveillés de France. Les recours contre la déclaration d''utilité publique et la révision du plan de prévention des inondations n''étaient pas suspensifs. Le cas montre la limite d''une mise en culture militante sans titre face à une procédure foncière publique.'
