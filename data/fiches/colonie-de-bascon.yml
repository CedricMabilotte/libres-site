famille: communaute_intentionnelle
resume: Au hameau de Bascon, à 800 m de Vaux près de Château-Thierry, Georges Butaud et Sophia Zaïkowska
  tentent en 1911 un nouveau milieu libre, dissous en 1912 ; une colonie communiste végétalienne y renaît
  en 1914. Au début de 1920, Butaud fonde une société coopérative pour mettre en valeur des terres incultes
  ; un baraquement racheté à l'armée américaine abrite une dizaine de colons l'hiver, une vingtaine l'été.
  Très fréquentée de 1919 à 1926, la colonie perd ses fondateurs en 1926. La coopérative est dissoute
  en 1931 et le domaine vendu ; le baraquement abrite une colonie de vacances naturienne jusqu'en 1951.
