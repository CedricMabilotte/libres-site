famille: communaute_intentionnelle
resume: À la fin de 1923, Louis Rimbault et Clémence Rimbault acquièrent pour 16 000 francs une dizaine
  d'hectares au lieu-dit Le Pin, à Luynes, près de Tours, pour y fonder « Terre Libérée », école pratique
  de végétalisme d'inspiration anarchiste. Le projet prévoit une société coopérative d'au plus vingt sociétaires
  adultes, avec habitations et jardins individuels, un conseil hebdomadaire et un administrateur tournant
  ; rien ne permet d'établir que ce fonctionnement ait été effectif. Le lieu reçoit plusieurs centaines
  de visiteurs les premières années, puis décline après 1927 ; Rimbault, paralysé par un accident en 1932,
  cherche à vendre dès 1933. Il meurt sur place en 1949 ; sa veuve vend le domaine en viager.
