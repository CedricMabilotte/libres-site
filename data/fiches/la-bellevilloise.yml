famille: lieu_non_marchand
resume: Coopérative ouvrière de consommation fondée le 21 janvier 1877 par des ouvriers mécaniciens de
  Belleville, d'inspiration proudhonienne. Elle fait construire en 1908-1910 sa Maison du peuple au 19-21
  rue Boyer (Paris 20e), agrandie en 1927 (salle Lénine au n° 25). Magasins, mutuelle, dispensaires, patronage
  laïque, université populaire La Semaille, cinéma et salles de réunion ouvertes aux organisations ouvrières
  y cohabitent. Elle compte 9 000 sociétaires en 1912 et 15 000 en 1929. Elle fait faillite en 1936, à
  la suite de la chute de la Banque ouvrière et paysanne ; certaines activités durent jusqu'en 1939.
