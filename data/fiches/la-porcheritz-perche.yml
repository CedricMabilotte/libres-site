resume: Lieu d'habitat collectif à Vichères (Eure-et-Loir), dans le Perche, membre du réseau CLIP. L'association
  Les Habitants de la Porcheritz (2013) a pour objet de créer un habitat collectif, solidaire et autogéré ; l'association
  propriétaire La Porcheritz (2014) a pour second membre le CLIP. Le compte rendu d'AG du CLIP de janvier 2022
  décrit un collectif qui vit sur place. La date et l'acte d'achat du foncier ne sont pas publics.
