  foncier_verrouille:
    valeur: partiel
    note: 'Le verrou tient au montage CLIP : l''association propriétaire n''a que deux membres, l''association usagère
      et le CLIP, qui détient « un droit de véto sur la revente ». Mais les statuts ne sont pas publiés : aucune
      clause d''inaliénabilité opposable aux tiers n''est vérifiée, et une association peut modifier ses statuts
      — la protection repose sur la composition des membres, pas sur un acte publié. L''acte d''achat lui-même n''est
      pas retrouvé.'
