fiabilite:
  verifie:
  - Propriété de la FPH, environ 600 ha, entités du domaine (EARL du Chemin Neuf, Écosite, golf, bail
    emphytéotique des châteaux) (FPH).
  - Accès gratuit de 25 ans accordé en 2006 sous charte agroécologique ; propriété depuis 1976 (Resilience.org
    / ARC2020).
  - Bail de 99 ans de 1989 à la Région et déclaration de la fondation sur une vente éventuelle (Le Parisien,
    relayé en 2020).
  non_confirme:
  - Forme juridique exacte de la fondation au regard du droit français.
  - Acte de commodat (non publié) et sa reconduction après 2031.
  - Issue, après 2020, du retrait envisagé par la Région.
  - 'Surface : 600 ha (FPH), 650 ha (ARC2020), 700 ha (Pollinis).'
