famille: commun_foncier
resume: 'Domaine d''environ 600 ha à Chaussy (Val-d''Oise), dans le Parc naturel régional du Vexin français,
  propriété depuis 1976 de la Fondation Charles Léopold Mayer pour le Progrès de l''Homme (FPH), fondation
  dont le siège est en Suisse. La ferme, reprise en 1995 et conduite en agroécologie, est exploitée par
  l''EARL du Chemin Neuf, à qui la fondation a accordé en 2006 un accès gratuit aux terres et aux bâtiments
  pour 25 ans sous charte agroécologique ; l''association Écosite gère un centre de séminaires. Les châteaux
  et le parc sont confiés depuis 1989 à la Région Île-de-France par bail emphytéotique de 99 ans ; un
  golf est exploité sur le domaine. Épreuve de référence : propriété privée « vertueuse » sans verrou,
  mise à disposition par prêt à usage.'
