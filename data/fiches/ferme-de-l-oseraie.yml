famille: communaute_intentionnelle
resume: 'Ferme collective de Berville-sur-Seine, dans le Parc naturel régional des Boucles de la Seine normande,
  tenue depuis 2011 par un collectif issu des mouvements étudiants rouennais. La maison a été achetée par l''association
  Le Jardin des 400 goûts grâce à des dons et des apports ; les terres (6 à 7 ha) et les bâtiments agricoles sont
  loués, également par une association. Maraîchage, verger, pain au levain, jus de pomme : personne n''est salarié,
  les recettes vont à une caisse commune, les personnes qui aident aux chantiers ouverts repartent avec des légumes
  gratuitement ou à prix libre, le reste est vendu au marché et en AMAP à Rouen. En 2018, l''équipe fondatrice a
  transmis la ferme à une équipe entièrement nouvelle sans rachat des bâtiments.'
