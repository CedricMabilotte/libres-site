dossier_juridique: 'Ferme sans chef d''exploitation ni salarié : production agricole réalisée par des membres bénévoles
  d''une association, recettes versées à une caisse commune. Le collectif rapporte que la police est venue plusieurs
  fois vérifier l''absence de travail dissimulé, sans suite à ce jour (« on est un peu une aberration, de leur point
  de vue »). Un essai de salariat en contrats aidés a été abandonné. Le régime social retenu par la MSA n''est pas
  publié. Aucun contentieux connu.'
