resume: Immeuble haussmannien de la rue de Rivoli à Paris, ancienne propriété du Crédit lyonnais vide
  depuis huit ans, occupé le 1er novembre 1999 par un collectif d'artistes. La Ville de Paris l'achète
  le 22 mai 2002 (4,57 M€) ; l'association est déclarée le 3 juin 2002. Après travaux, le lieu rouvre
  en novembre 2009 sous une convention d'occupation de 3 ans signée le 25 août 2009, prolongée par avenant
  en 2013. Une trentaine d'artistes y ont leur atelier contre une participation mensuelle ; l'entrée est
  libre pour des dizaines de milliers de visiteurs par an.
