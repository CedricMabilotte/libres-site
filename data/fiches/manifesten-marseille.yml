    note: 'Collectif constitué en 2016 ; en janvier 2022, il décrit trois cercles, dont un collectif d''environ
      dix-huit personnes « renouvelés à 1/3 tous les trois ans » (source 6). Tract de 2020 : « En cas
      de départ du collectif Manifesten, nos statuts nous engagent à trouver un autre collectif d''habitants
      pour l''usage du lieu » ; si l''association périclite, New Al Dante et le CLIP « s''engagent à trouver
      un autre collectif » (source 3) ; la revente exige l''unanimité des deux membres de l''association
      propriétaire (source 8). Statuts et clause d''incessibilité non publiés. Sources consultées le 20
