resume: Café-librairie associatif et lieu de luttes au 59 rue Adolphe-Thiers, Marseille 1er, rouvert par une nouvelle
  équipe en février 2016. Menacé par la vente des murs en 2020, le collectif (une quinzaine de personnes, « sans
  chef·fe ni salarié·e ») a lancé une collecte pour acheter le lieu (environ 190 000 € frais compris) ; l'association
  New Al Dante en devient propriétaire, avec une clause d'incessibilité annoncée, et le lieu entre dans le réseau
  CLIP. On y trouve une librairie, un bar, des cours de français pour femmes et les réunions d'une quinzaine de
  collectifs.
