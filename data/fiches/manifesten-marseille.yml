    valeur: revenus_individuels_externes
    note: Collectif « sans chef·fe ni salarié·e » en 2020 (source 3) ; ses membres ne vivent pas sur place
      (« contexte un peu différent que les collectifs qui vivent sur place ») et « le temps est bien partagé
      entre le privé et le professionnel » (source 6, janvier 2022). Le lieu « dégage 1 000 euros de loyer
      chaque mois, soit 12 000 euros par an », somme destinée à rembourser sur une douzaine d'années les
      prêts de l'achat (environ 190 000 € frais compris) ; 1 600 adhérent·es à New Al Dante en 2020 (source
      3). Un poste salarié annoncé pour mai-juin 2022 (source 6) ; au répertoire Sirene, New Al Dante
      est marquée employeuse, l'association Manifesten (déclarée en 2021) non (sources 9 et 10). Sources
      consultées le 20 novembre 2026.
