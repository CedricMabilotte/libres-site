resume: Ferme d'environ 27 hectares du hameau de la Marinie, à Causse-et-Diège (nord Aveyron). L'aventure collective
  commence en 2017 ; l'association Les Communs de la Marinie, créée en 2021, réunit les usager·es du lieu. Une collecte
  lancée en 2021 a permis l'entrée du lieu dans Antidote, et la propriété a été transférée au fonds de dotation
  en novembre 2024. On y cultive céréales et oléagineux, on y fait pain et savons, et le lieu accueille ateliers,
  projections et soirées.
