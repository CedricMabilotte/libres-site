portes:
  forme_civile:
    valeur: oui
    note: Association loi 1901 usagère ; propriété d'un fonds de dotation piloté par l'association Les Passagères
      de l'usage.
    source: 3
  foncier_verrouille:
    valeur: partiel
    note: 'Propriété transférée au fonds en novembre 2024. Aucune clause d''inaliénabilité publiée dans les statuts
      du fonds : selon Silence (2023), Antidote « peut vendre un lieu à l''unanimité de son conseil d''administration
      » (trois administrateur·rices nommé·es par Les Passagères de l''usage). La dévolution de l''actif net d''un
      fonds de dotation dissous à un autre fonds ou à une fondation RUP est légale (loi 2008, art. 140) mais ne
      verrouille pas le lieu lui-même ; le bail emphytéotique de 99 ans, qui serait opposable à un acquéreur, n''est
      pas publié pour ce lieu.'
    source: 4
  usage_ig:
    valeur: oui
    note: Activité agricole et artisanale sans rente foncière, ouverte au territoire (ventes, ateliers, soirées).
    source: 1
  autogestion:
    valeur: oui
    note: L'association des usager·es décide des usages ; chaque lieu envoie deux délégué·es au Conseil communal
      des Passagères de l'usage (consensus, à défaut majorité qualifiée), qui pilote le fonds.
    source: 3
  etabli:
    valeur: non
    note: 'Aventure commencée en 2017 : neuf ans en 2026. Pas encore établi — normal pour un lieu récent.'
    source: 1
