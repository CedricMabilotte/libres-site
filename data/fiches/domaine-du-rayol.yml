famille: lieu_non_marchand
resume: 'Domaine côtier des Maures au Rayol-Canadel-sur-Mer (Var), acquis en 1989 par le Conservatoire
  du littoral après une mobilisation locale contre un projet d''urbanisation. La gestion est confiée par
  convention à l''Association du Domaine du Rayol (ADORA), déclarée en septembre 1989, qui emploie une
  trentaine de salariés permanents. Le site, dont le Jardin des Méditerranées, est ouvert au public tous
  les jours, avec une entrée payante. Épreuve de référence : foncier public inaliénable, mais gestion
  déléguée à un établissement associatif salarié, sans collectif d''usagers souverain.'
