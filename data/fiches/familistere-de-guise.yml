resume: Habitation collective (« Palais social ») construite à partir de 1859 à Guise par l'industriel
  fouriériste Jean-Baptiste André Godin pour les travailleurs de ses usines. Le 13 août 1880, Godin apporte
  terrains, immeubles et usines à l'« Association coopérative du capital et du travail, société du Familistère
  de Guise », constituée pour 99 ans. L'association gère logements, économats, écoles et caisses de secours
  ; seuls les associés, résidents, forment l'assemblée. Le 22 juin 1968, l'assemblée générale extraordinaire
  dissout la société, les titres d'épargne deviennent des actions de Godin SA et les logements passent
  en copropriété. Le site est aujourd'hui un musée géré par un syndicat mixte.
