      des résident·es temporaires et aux recettes des événements et du bar associatif ; budget prévisionnel
      2018 : 96 100 € de produits, dont guinguette 23 600 €, mise à disposition 27 000 €, cotisations
      22 700 €, catering 22 800 € ; loyer 32 400 € (sources 2 et 8). Remboursement du prêt : 4 500 € par
      mois, environ 54 000 € par an, sur un budget prévisionnel de 113 800 € en 2020 (source 4). Après
      l''incendie de 2025, aide financière votée par la Ville de Marseille et la Métropole, cagnotte de
      soutien (source 5). Au répertoire Sirene, l''association En Devenir est non employeuse ; une association
      « En Devenir 2 », domiciliée à la même adresse, compte 1 ou 2 salariés en 2024, sans que son rôle
      dans le lieu soit publié (source 10). Ce dont vivent les personnes n''est pas publié. Sources consultées
