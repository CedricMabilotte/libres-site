famille: lieu_non_marchand
resume: Ancienne cimenterie et carrière sur les hauteurs de L'Estaque (Marseille 16e), louée depuis 2015 par un
  collectif d'artistes issu de l'association En Devenir (2012) et devenue un lieu autogéré de création et de résidences,
  aussi habité. Le lieu a été acheté au printemps 2019, pour 410 000 € : un apport de 136 000 €, réuni par des prêts solidaires, a permis d'obtenir des crédits bancaires remboursés par les loyers du collectif
  ; il est détenu par l'association Parpaing Libre, dont les deux seuls membres sont l'association usagère et le
  réseau CLIP. L'incendie du 8 juillet 2025 a détruit ateliers, boulangerie et logements de résidence ; la reconstruction
  se fait en chantiers participatifs.
