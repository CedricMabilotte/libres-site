portes:
  forme_civile:
    valeur: oui
    note: 'Associations En Devenir (usagère), Parpaing Libre (propriétaire, loi 1901) et CLIP : chaîne
      entièrement associative.'
    source: 6
  foncier_verrouille:
    valeur: oui
    note: 'Objet de Parpaing Libre : empêcher la revente et garantir l''usage « ad vitam aeternam » ;
      en cas de défaillance, l''usage est confié à un autre collectif. Le verrou tient au montage CLIP
      : l''association propriétaire n''a que deux membres, l''association usagère et le CLIP, qui détient
      « un droit de véto sur la revente ». Mais les statuts ne sont pas publiés : aucune clause d''inaliénabilité
      opposable aux tiers n''est vérifiée, et une association peut modifier ses statuts — la protection
      repose sur la composition des membres, pas sur un acte publié. Règle P2 « meilleur effort documentaire
      » (décision de Ced, 2026-10-01) : le verrou est établi par des sources concordantes, même sans acte
      publié. Veto du réseau CLIP sur la revente, objet anti-revente de l''association propriétaire.'
    source: 2
  usage_ig:
    valeur: oui
    note: Plus d'une centaine d'artistes accueilli·es en résidence ; guinguette à prix libre et portes
      ouvertes au quartier.
    source: 1
  autogestion:
    valeur: oui
    note: Lieu autogéré ; l'association usagère est l'un des deux membres de la propriétaire.
