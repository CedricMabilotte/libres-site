famille: communaute_intentionnelle
resume: 'En 1970, une communauté anarchiste s''installe dans le noyau villageois abandonné de Villeneuve-du-Bosc,
  commune rattachée à Saint-Jean-de-Verges (Ariège) en 1975, près de Foix. Rattachée à la Fédération anarchiste,
  elle figure dans l''annuaire des groupes du Monde libertaire d''avril 1970 à octobre 1971 et s''y décrit
  comme un centre de vie « non autoritaire, autogestionnaire, libertaire » : bibliothèque, accueil de
  jeunes militants l''été, travaux saisonniers à l''extérieur, projet d''association de soutien. En décembre
  1970, un membre est détenu à la maison d''arrêt de Foix ; le collectif y voit une manœuvre contre la
  communauté. Le propriétaire des lieux, le titre d''occupation, l''effectif et la date de fin ne sont
  documentés par aucune source consultée ; aucune trace n''a été trouvée après octobre 1971.'
