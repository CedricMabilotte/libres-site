resume: En 1970, une communauté libertaire s'installe dans le noyau villageois abandonné de Villeneuve-du-Bosc,
  près de Foix, pour y mener une expérience de « commune libertaire » dans le sillage du néo-ruralisme
  d'après 1968. La commune administrative est rattachée à Saint-Jean-de-Verges en 1975. D'autres communautés
  ariégeoises de la même période sont citées sans détail. Le mode d'accès au lieu, la gouvernance et la
  date de fin ne sont documentés par aucune source consultée.
