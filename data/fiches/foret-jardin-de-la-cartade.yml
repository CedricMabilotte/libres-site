resume: Forêt-jardin, pré-vergers, haies, potager et mare cultivés depuis l'automne 2020 par une association de bénévoles sur une parcelle d'environ 5 600 m² à Glaine-Montaigut (Puy-de-Dôme). Le terrain appartient à une co-fondatrice, qui l'a mis à disposition de l'association par bail emphytéotique. En 2023, l'association comptait une cinquantaine de bénévoles mobilisables, environ 150 sympathisants et treize personnes coordonnant le projet en groupes de travail autonomes. Aucune vente ni aucun salarié ne sont documentés ; les plantations ont été financées par le budget écologique citoyen du Département (2020 et 2022). Le lieu ouvre ses portes au public chaque automne (fête de la Cartade, 4 octobre 2026).
