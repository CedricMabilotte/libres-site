dossier_juridique: 'Association de bénévoles sans salarié (répertoire Sirene : non employeuse, activité 94.99Z). Aucune vente documentée : rien n''indique d''activité agricole au sens fiscal ou social. Aucune déclaration MSA, aucun rescrit fiscal ni reçu fiscal mentionnés dans les sources publiques. Financement public (budget écologique citoyen du Puy-de-Dôme, 2020 et 2022). Point juridique : un bail emphytéotique, d''une durée supérieure à douze ans, doit être passé en la forme authentique et publié au service de la publicité foncière ; sa durée réelle n''est pas publiée.'
