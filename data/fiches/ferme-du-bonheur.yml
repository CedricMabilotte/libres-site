resume: Lieu associatif installé depuis 1992-1993 sur une friche de Nanterre jouxtant l'université, au-dessus des échangeurs de l'A14 et de l'A86. Fondé par Roger des Prés avec des bénévoles et des artistes, il mêle élevage (chèvres, moutons, porcs, volailles), potagers, céréales anciennes, théâtre, bals et fêtes. Depuis le 28 décembre 2008, la Ferme a « pris autorité » sur un terrain voisin de plus de quatre hectares, le champ de la Garde, devenu le parc rural expérimental (PRé), sous convention d'occupation précaire et menacé par le projet d'aménagement Seine-Arche. En 2022, la municipalité réduit de moitié ses subventions et lui retire l'habilitation à recevoir du public.
