dossier_juridique: 'Ferme urbaine associative sans statut agricole propre : aucune disposition ne vise les fermes urbaines. L''élevage et la culture sont agricoles par nature (C. rur., art. L. 311-1) ; la vente de fromage et de miel et la présence de salariés exposent le dirigeant à l''appréciation de la MSA (affiliation si l''activité minimale d''assujettissement est atteinte, cotisation de solidarité sinon : voir le dossier association agricole et R1). La protection du lieu dépend de l''urbanisme et des conventions d''occupation, pas du droit rural.'
