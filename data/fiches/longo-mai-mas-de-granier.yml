resume: Ferme collective du réseau Longo Maï lancée en 1990 par des habitants de la coopérative de Limans devenue trop nombreuse, sur 27 ha à Saint-Martin-de-Crau (Bouches-du-Rhône). Une vingtaine de personnes y vivaient en 2023 sans salaire, avec une caisse commune et 60 euros d'argent de poche mensuel ; elles produisent conserves de légumes, foin de Crau, pain, pâtes fraîches et miel, vendus sur les marchés et à la ferme, et lancent dès 1992 des paniers hebdomadaires. Le lieu accueille personnes sans papiers, voyageurs et réseaux militants, soutient la caravane solidaire vers la frontière italienne et met sa conserverie en location aux paysans voisins. Le statut indiqué est associatif ; une société civile au nom du mas, créée en 1990, figure au répertoire.
