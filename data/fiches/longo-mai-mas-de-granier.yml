dossier_juridique: Activité commerciale régulière (conserves, foin AOC de Crau, pain, pâtes, miel vendus sur les marchés ; location de la conserverie à des paysans voisins) portée par un collectif présenté comme associatif, sans salariat. Aucune source sur l'affiliation MSA, le régime fiscal ou l'entité qui déclare l'exploitation ; aucun établissement agricole au nom du réseau n'a été trouvé à Saint-Martin-de-Crau au répertoire Sirene. Une société civile au nom du mas (« SCA Mas de Granier », location de terrains) existe depuis 1990. En 2023, le Mas de Granier et la Cabrery étudiaient le statut d'organisme d'accueil communautaire et d'activités solidaires (OACAS), utilisé par Emmaüs, pour faciliter la régularisation de personnes sans papiers accueillies.
