resume: Lieu collectif autogéré de Monoblet, en Sud-Cévennes (Gard), qui mène depuis plus de douze ans des activités
  agricoles et culturelles. Un collectif d'une dizaine de personnes y pratique le maraîchage en traction animale
  et la culture et transformation de la châtaigne, son activité économique principale, et organise concerts à bas
  coût et résidences à prix libre. L'association La Faille en gère l'usage ; la propriété a été transférée au fonds
  de dotation Antidote en novembre 2024.
