      ans d''activité, source 8). Devenir du lieu : propriété transférée au fonds de dotation Antidote,
      qui parle de « donations » signées « le 22 novembre et le 19 mars » pour la Marinie, la Faille et
      Keriskis sans préciser quelle date vaut pour quel lieu (source 2) ; le fonds rend l''usage à l''association
      par un bail emphytéotique de 99 ans « moyennant une redevance modique » ; les statuts des associations
      des lieux réservent « une qualité de membre de droit aux Passagères de l''Usage » pour prévenir
      « des modifications statutaires, des cessions de droits réels, ou le non-respect du cadre de l''intérêt
      général » ; le réseau revendique la « séparation entre le devenir des lieux et celui des personnes
      » (source 3) et « la stratégie est de faire durer les lieux, et non les collectifs » (source 4).
      Statuts et bail non publiés. Sources consultées le 20 novembre 2026.'
