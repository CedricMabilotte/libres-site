resume: 'Forêt-jardin lancée au début de 2023 sur un terrain communal du hameau de Persignat, à Aubiat (Puy-de-Dôme), en pleine plaine céréalière de Limagne. La municipalité a laissé « carte blanche » au collectif réuni par l''association Matercoop (déclarée en 2012) pour aménager un espace arboré et convivial : douze premiers fruitiers autour d''un labyrinthe de méditation, plantes potagères et médicinales. Le groupe, une vingtaine de bénévoles en janvier 2023, a recensé d''autres terrains communaux à planter.'
