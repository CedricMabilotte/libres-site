uid: hameau-des-buis
nom: Le Hameau des Buis
autres_noms: []
famille: communaute_intentionnelle
resume: 'Écohameau intergénérationnel du sud de l''Ardèche, associé à l''origine à l''école La Ferme des
  Enfants (ouverte sur place en septembre 2008). Le foncier est porté par une société constituée le 12
  février 2004 : société civile à l''origine, financée par des prêts des résidents remboursés au départ,
  aujourd''hui SAS coopérative à capital variable qui se déclare « à but non lucratif » et collecte des
  apports en comptes courants d''associés. Épreuve de référence : porteur foncier sociétaire, sans verrou
  anti-revente publié.'
