dossier_juridique: 'Cas d''un collectif pluriactif sans revenu agricole principal, accompagné par la collectivité : espace-test de Grand Besançon Métropole pendant trois ans, puis bail rural de neuf ans consenti par la Ville sur un terrain municipal. Le bail rural suppose un preneur exploitant ; les sources ne disent pas s''il a été consenti à l''association (immatriculée en 2024 avec le code 01.13Z, culture de légumes) ou à des membres. Le temps de travail réparti entre six personnes ayant chacune un autre emploi pose la question de l''activité minimale d''assujettissement à la MSA (cotisation de solidarité possible pour chacune), sans source sur la solution retenue. Vente marchande en paniers, en magasin et à des restaurants.'
