resume: Collectif de maraîchage biologique sur petite surface formé à Besançon début 2022 par des personnes qui gardent toutes une autre activité professionnelle (enseignement, ingénierie, livraison, orthophonie). Après trois ans sur l'espace-test « Graines de maraîchers » de Grand Besançon Métropole à Chalezeule, il cultive depuis l'été 2025 1,5 ha à Port Douvot, sur un terrain confié par la Ville de Besançon par bail rural de neuf ans. Six maraîchers et une dizaine de bénévoles réguliers y produisent une quarantaine de variétés, vendues en paniers (10 ou 16 euros, prix réduits pour les revenus modestes), en Biocoop et à des restaurants. L'association a été immatriculée en 2024.
