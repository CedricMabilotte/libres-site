nom: L'Essai – Colonie communiste d'Aiglemont
autres_noms:
- Colonie libertaire d'Aiglemont
- Milieu libre d'Aiglemont
famille: communaute_intentionnelle
resume: 'Colonie communiste libertaire fondée en juin 1903 par Fortuné Henry dans la clairière du Gesly,
  à Aiglemont (Ardennes), sur un terrain d''environ un hectare qu''il achète lui-même. Des terres communales
  attenantes sont ensuite louées pour la culture. Financée par des souscriptions libertaires, elle compte
  11 colons en octobre 1904 et 20 en 1905, vit de maraîchage et d''élevage, et édite à partir de 1906
  le journal Le Cubilot. Poursuites judiciaires, difficultés financières et conflits la défont : Henry
  et sa compagne partent les derniers en juillet 1908 et un huissier liquide la colonie en mars 1909.'
