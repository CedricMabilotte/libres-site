famille: occupation_regularisee
resume: 'Espace social, culturel et politique autogéré de Dijon, ouvert en octobre 1998 dans d''anciens
  bâtiments industriels du boulevard de Chicago. Une convention d''occupation gratuite est obtenue en
  2002 après cinq ans de menaces d''expulsion. Menacé par des projets municipaux, le collectif négocie
  un relogement : la Ville finance des travaux (environ 1,5 M€) dans un ancien entrepôt de 900 m², où
  il s''installe en 2015 sous un bail de 12 ans renouvelable. Le lieu combine habitat collectif, salle
  de concert et activités publiques non marchandes ; le renouvellement du bail est incertain.'
