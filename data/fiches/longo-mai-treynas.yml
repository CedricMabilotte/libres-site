  - Écart entre la création au répertoire (1998) et la date de 2002 donnée par Silence
  - Qualité sous laquelle la MSA a enregistré l'association (chef d'exploitation désigné, cotisant de solidarité, autre)
  - Nature et durée du contrat de location avec la fondation
  - Effectif actuel (« une trentaine de membres » selon l'AFP en 2025, adultes et enfants non distingués)
  - Rapport entre Fonds de Terre et la « Fondation Longo Mai » inscrite au répertoire Sirene en 2025
dossier_juridique: 'Cas le plus net trouvé d''une association agricole sans salarié déclarée à la MSA : selon Silence (2016), « depuis 2002, la communauté de Treynas est officiellement l''association loi 1901 Longo Maï Ardèche, inscrite à la MSA, et ses membres sont tous bénévoles ». Le répertoire Sirene montre une association créée en 1998 à Chanéac, non employeuse, avec un code d''activité d''ingénierie (71.12B) et non agricole. La qualité d''affiliation retenue par la caisse n''est pas publiée ; aucune source ne dit si un membre est déclaré chef d''exploitation. L''association vend aliments, bois transformé et prestations en forêt et en construction ; régime fiscal de ces ventes non documenté. Elle est locataire de la fondation propriétaire ; la nature du contrat n''est pas connue (une association peut être preneuse d''un bail rural : Cass. 3e civ., 14 janvier 2015, n° 13-26.380). Le reportage AFP de 2025 confirme l''absence de salariat mais ne dit rien du régime MSA. Aucun contentieux publié sur le statut social ou agricole.'
