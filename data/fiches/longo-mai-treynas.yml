resume: Communauté du réseau Longo Maï installée depuis la fin des années 1980 au hameau de Treynas, sur la commune de Chanéac (haute Ardèche). Une vingtaine d'adultes et d'enfants y vivaient en 2016 de cultures, d'élevage, de transformation et de toute la filière forêt-bois (bûcheronnage, débardage à cheval, scierie, menuiserie, charpente). Depuis 2002 selon Silence, la communauté est l'association loi 1901 Longo Maï Ardèche, inscrite à la MSA, dont tous les membres sont bénévoles ; elle loue 52 ha de terres agricoles et 100 ha de forêt à Fonds de Terre, fondation du réseau propriétaire des lieux. Elle vend produits de la ferme, bois transformé et prestations, et a été autosuffisante plusieurs années sans recourir aux dons du réseau. En 2025, l'AFP y décrit une trentaine de membres, sans hiérarchie ni salariat, vivant principalement de l'exploitation forestière et du sciage, avec un compte commun et des décisions prises par consensus.
