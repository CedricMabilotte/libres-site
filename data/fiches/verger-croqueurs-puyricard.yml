dossier_juridique: 'Association de bénévoles « librement engagés », sans salarié (répertoire Sirene : non employeuse, 94.99Z) ; la charte précise que le verger n''est pas « une entreprise d''employés ». Ventes ponctuelles d''arbres de collection (matériel de reproduction de variétés anciennes à des amateurs : article L. 661-8 du code rural) et de fruits lors de deux journées annuelles ; régime fiscal et social de ces ventes non publié. Aucune déclaration MSA, aucun rescrit mentionné ; appel aux dons en ligne sans mention de reçu fiscal. Clause statutaire de dévolution de l''actif à une association analogue, par priorité au réseau national.'
