famille: lieu_non_marchand
resume: 'Verger conservatoire tenu depuis plus de trente ans par l''association des Croqueurs de pommes de Provence-Alpes-Côte d''Azur, dite « Li Vieii Pero », fondée en juillet 1992, sur un terrain mis à disposition par la Ville d''Aix-en-Provence au chemin du Grand Saint-Jean, à Puyricard. Les bénévoles y accèdent librement le mardi pour tailler, greffer, expérimenter et conserver des variétés fruitières régionales ; l''association comptait 350 adhérents en 2024. Le verger se définit comme « une association de bénévoles librement engagés », ni verger de production, ni entreprise, ni parc public : il est réservé aux adhérents, mais ouvert au public lors de journées portes ouvertes annuelles où sont vendus des arbres et des fruits de collection.'
