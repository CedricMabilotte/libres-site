famille: communaute_intentionnelle
resume: 'Écolieu de la vallée de la Drôme, au lieu-dit Les Combeaux (Piégros-la-Clastre), lieu de stages
  depuis la fin des années 1970. L''association Accueil et Échanges, propriétaire depuis plus de dix ans,
  en a fait donation au fonds de dotation Fraternité pour Demain, qui a consenti un bail emphytéotique
  de 99 ans à la Coopérative Oasis ; celle-ci sous-loue au collectif habitant, constitué en 2024 en association
  (L''Aub''ascule). Le lieu porte des activités de stages, d''accueil solidaire et de permaculture, et
  une obligation réelle environnementale. Épreuve de référence : foncier en fonds de dotation, mais un
  maillon coopératif intercalé entre le propriétaire et les usagers.'
