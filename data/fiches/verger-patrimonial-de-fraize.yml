resume: 'Verger communal de 55 ares installé à partir de 1997-1998 dans l''ancien parc de la maison Wald, au centre de Fraize (Vosges), sous la responsabilité de l''association de sauvegarde du patrimoine La Costelle. Décidé par le conseil municipal en décembre 1995 avec l''aide de l''État (fonds de gestion de l''espace rural), il conserve les variétés anciennes de pommes, poires et prunes du canton. Un groupe de bénévoles s''y réunit chaque semaine d''avril à l''automne : taille, greffage, identification des fruits, récolte, atelier de jus de pommes ; greffons et sujets greffés sont mis à disposition, et le verger accueille écoles et visiteurs.'
