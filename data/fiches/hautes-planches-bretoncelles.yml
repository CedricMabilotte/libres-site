resume: 'Ancien moulin à Bretoncelles, dans le Perche ornais : lieu d''habitat, d''ateliers et d''activités culturelles,
  avec des espaces à prix libre accessibles à tous. L''association usagère Hautes Planches, déclarée en mai 2017,
  occupe et gère le lieu ; l''association Les Donnettes a acheté le corps principal du moulin en octobre 2017, puis
  une parcelle complémentaire par financement participatif. Montage CLIP : Les Donnettes n''a que deux membres,
  l''association usagère et le réseau CLIP, garant de la non-revente.'
