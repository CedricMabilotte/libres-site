famille: commun_foncier
resume: 'Petite ferme d''élevage de petits animaux (volailles, chèvres, porcs, cochons d''Inde, lapins) tenue depuis 2015 par une association loi 1901 sur un espace vert municipal de l''écoquartier des Vaîtes, à Besançon. Elle se définit comme « associative, bénévole, participative, écologique et pédagogique » : aucun salarié, soins quotidiens répartis entre bénévoles, soin collectif le samedi matin, ateliers pédagogiques. Les animaux ne sont ni consommés ni vendus ; l''association vit de cotisations, de subventions, de dons et de ventes d''objets. En 2019, une inspection vétérinaire déclenchée par un signalement n''a relevé aucune anomalie de bien-être animal.'
