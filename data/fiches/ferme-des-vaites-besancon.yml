dossier_juridique: 'Élevage associatif sans salarié et sans vente. La seule interaction administrative documentée est sanitaire : en juillet 2019, une vétérinaire de la direction départementale chargée de la protection des populations a inspecté la ferme à la suite d''un signalement de militantes opposées à la détention d''animaux ; elle n''a relevé aucune anomalie de bien-être, n''a pas consulté le registre d''élevage (tenu par l''association « plus par souci d''efficacité que par obligation légale ») et a demandé de déclarer et d''identifier par boucles les petits ruminants et les porcs. Aucune déclaration à la MSA ni à la PAC n''est mentionnée dans les sources publiques.'
