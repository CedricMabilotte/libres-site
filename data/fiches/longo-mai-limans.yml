famille: communaute_intentionnelle
resume: 'En 1973, de jeunes militants issus des groupes Spartakus (Suisse) et Hydra (Autriche) achètent
  par collecte un domaine d''environ 270 hectares à Limans, près de Forcalquier, avec les fermes de Grange-Neuve
  et du Pigeonnier : c''est la première coopérative du réseau Longo Maï. Une centaine de personnes y vivent
  sans salaire, les ressources étant mises en commun, et décident par consensus ; élevage, céréales, maraîchage,
  transformation, forêt et Radio Zinzine (1981) font vivre le lieu, avec une part importante de dons.
  Le réseau déclare détenir son foncier en propriété collective inaliénable par une fondation suisse,
  le Fonds de Terre Européenne. Le lieu a connu la répression d''État (refus de titres de séjour en 1973,
  opération de police en 1989).'
