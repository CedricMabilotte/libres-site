resume: 'Maison d''environ 100 m² à Gaillac (Tarn), utilisée depuis septembre 2019 par l''association L''Antre d''Eux
  pour héberger et accompagner des jeunes exilé·es en attente de reconnaissance de leur minorité ; cinq y vivent
  en permanence et vingt à trente sont accueilli·es chaque jour. Une collecte via Antidote vise l''achat de la maison,
  qui serait ensuite confiée par bail emphytéotique à l''association usagère L''Antre Toit. En décembre 2025, la
  vente « devrait se faire prochainement » : le transfert n''est pas réalisé.'
