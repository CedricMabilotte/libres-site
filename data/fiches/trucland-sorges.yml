famille: communaute_intentionnelle
resume: 'Écolieu associatif fondé par huit amis issus d''une association culturelle de Seine-et-Marne (La Fée des trucs, 2006-2019), installés en 2019 à Sorges-et-Ligueux-en-Périgord (Dordogne) après l''achat d''un terrain et d''une maison, signé en octobre 2019. Le projet combine micro-ferme sur sol vivant (fruits, légumes, poules, abeilles, transformation), ateliers, écoconstruction et événements culturels ; les surplus sont échangés par « troc et vente » avec les riverains. Le répertoire Sirene montre une société civile immobilière Truc''land créée en mai 2019 à la même adresse, propriétaire de six parcelles (1,46 ha) au lieu-dit Les Clèdes selon le fichier cadastral de la DGFiP : le foncier n''est pas porté par l''association.'
