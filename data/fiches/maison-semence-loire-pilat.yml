dossier_juridique: 'Association sans salarié (répertoire Sirene : non employeuse, 94.99Z). Les semences sont cédées gratuitement ou troquées à des jardiniers amateurs : régime de l''article L. 661-8 du code rural (réd. loi n° 2020-699), qui soustrait au catalogue officiel la cession, même onéreuse, de semences de variétés du domaine public à des utilisateurs non professionnels. Aucune vente régulière, donc aucun revenu agricole documenté ; aucune déclaration MSA, aucun rescrit ni reçu fiscal mentionnés. Aucun incident administratif publié.'
