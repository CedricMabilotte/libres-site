famille: lieu_non_marchand
resume: 'Groupe local de la Maison de la Semence de la Loire, association membre du Réseau Semences Paysannes déclarée en 2011. Depuis 2016, six à dix bénévoles se retrouvent une demi-journée par semaine à Maclas (Loire) pour cultiver des variétés potagères paysannes jusqu''à la graine, sur un terrain « gracieusement prêté » au lieu-dit Chorée, puis sur un lieu de culture collective à Goély. Les graines alimentent une grainothèque : elles sont « adoptées » gratuitement par des jardiniers qui en rendent une part, distribuées et troquées lors de rendez-vous à Pélussin et Saint-Étienne. Le groupe compte une vingtaine de membres qui viennent « sans devoir justifier leur absence ».'
