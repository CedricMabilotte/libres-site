famille: occupation_regularisee
resume: 'Bocage de l''ancien projet d''aéroport du Grand Ouest, occupé à partir de la fin des années 2000
  par des opposant·es au projet. Après l''abandon de l''aéroport (17 janvier 2018) et les expulsions d''avril
  2018, l''usage a été régularisé par étapes : rétrocession de 895 ha au Département de Loire-Atlantique
  (vote du 25 mars 2019), baux ruraux à clauses environnementales, puis vote le 10 octobre 2024 de baux
  emphytéotiques de 25 ans au profit d''associations de représentants des usagers pour régulariser des
  habitats. En parallèle, le fonds de dotation « La Terre en commun », lancé fin 2018, rachète des bâtis
  et terres pour les placer hors du marché. Environ 200 personnes y vivaient en 2020.'
