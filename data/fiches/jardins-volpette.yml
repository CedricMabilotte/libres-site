dossier_juridique: 'Les jardins familiaux sont la seule culture collective que le code rural organise expressément sans exploitant : l''article L. 561-1 impose aux associations de jardins ouvriers, qui répartissent des parcelles « que leurs exploitants cultivent personnellement, en vue de subvenir aux besoins de leur foyer, à l''exclusion de tout usage commercial », la forme d''association déclarée ou reconnue d''utilité publique (loi du 26 juillet 1952, codifiée). L''article L. 562-1 ouvre la préemption de la SAFER à leur demande ; l''article L. 563-1 leur garantit des terrains équivalents en cas d''expropriation. Côté MSA, faute de revenu professionnel, la cotisation de solidarité n''est pas due (art. D. 731-34, voir recherche R1). Le régime ne verrouille pas le foncier.'
