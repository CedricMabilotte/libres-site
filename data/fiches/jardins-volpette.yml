resume: Jardins ouvriers de Saint-Étienne fondés en 1894 par le jésuite Félix Volpette, sur le modèle de l'œuvre de Félicie Hervieu à Sedan. Le premier terrain, deux hectares au-dessus du Clapier, est acheté 200 francs et divisé en cinquante lots ; d'autres sont donnés ou cédés pour une location symbolique par la Société des Houillères. L'association, rebaptisée du nom de son fondateur en 1938, compte environ 3 400 jardins à cette date et gère en 2005 quarante hectares répartis en 45 sections, cultivés par 1 650 jardiniers pour les besoins de leur foyer.
