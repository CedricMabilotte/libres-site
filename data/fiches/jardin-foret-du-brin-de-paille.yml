resume: Jardin-forêt comestible planté depuis janvier 2023 par une association de bénévoles sur un pré communal de 1 200 m² au centre de Saint-Genès-Champanelle (Puy-de-Dôme). L'idée est née d'une consultation des habitants sur le projet d'aménagement communal ; l'association a été déclarée en 2022. La commune met le terrain à disposition pour un loyer modeste, à condition qu'il reste un espace public et que les manifestations restent gratuites. Le principe affiché est celui d'un « réservoir d'aliments » où chacun vient cueillir selon ses besoins, « dans l'esprit de prendre et de donner quelque chose ».
