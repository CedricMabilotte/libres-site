famille: occupation_regularisee
resume: 'Anciennes terres maraîchères de l''est de Dijon, près des anciens abattoirs, occupées depuis
  mars 2010 par une manifestation-défrichage contre un projet d''écoquartier de 1 400 logements, suspendu
  en 2019. La Ville a racheté en juin 2023 environ 80 % du site de 8,7 ha à la SPLAAD et à l''EPFL de
  Côte-d''Or (4,25 M€). En septembre 2025, un compromis a été annoncé : une association à créer signerait
  une convention de mise à disposition, les occupant·es cédant 1,14 ha pour 60 logements sociaux. Environ
  100 personnes y vivent ; le lieu associe jardins, marché à prix libre et activités culturelles.'
