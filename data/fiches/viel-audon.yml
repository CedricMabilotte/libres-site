uid: viel-audon
nom: Le Viel Audon
autres_noms:
- Hameau du Viel Audon
famille: lieu_non_marchand
resume: 'Hameau abandonné des gorges de l''Ardèche, à Balazuc, le Viel Audon est redécouvert en 1972 par
  de jeunes gens : les ruines sont achetées et reconstruites pierre à pierre par des chantiers de jeunes
  bénévoles. Pour résoudre la question de la propriété, le site est confié à l''association Le Mat par
  un bail emphytéotique de 99 ans. Le hameau associe aujourd''hui l''association Le Mat (accueil, éducation
  à l''environnement), l''Association des jeunes de chantier, une ferme en SCEA et d''autres structures
  ; 15 à 20 personnes y vivent à l''année. Un conseil de hameau réunit les résidents chaque trimestre
  ; les salariés sont payés au SMIC avec prime d''ancienneté.'
