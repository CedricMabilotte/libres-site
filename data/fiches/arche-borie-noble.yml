resume: La communauté de l'Arche, fondée par Lanza del Vasto dans le sillage de Gandhi, rachète en 1963
  le domaine de La Borie Noble, à Roqueredonde (Hérault), qui devient l'un de ses lieux principaux. Célibataires
  et familles y mènent une vie d'agriculture, d'artisanat, de prière et de non-violence ; les revenus
  sont redistribués selon les besoins et les décisions se prennent à l'unanimité, au consensus ou au vote
  selon leur importance. La communauté accueille de nombreux hôtes et s'engage dans les luttes locales.
  Après un déclin des effectifs, la communauté de La Borie Noble a été suspendue et une refondation engagée
  (Silence n°463) ; une association L'Arche de Lanza del Vasto a son siège sur le lieu.
