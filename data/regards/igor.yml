# Faces @igor (savoir d'usage) — 2026-09-30. Voix porteuse de libres.
faces:
  la-chapelle-toulouse: |
    Ce qui tient : plus de trente ans sans salarié ni subvention, le bénévolat écrit dans les statuts, des décisions prises au consensus par ceux qui font vivre le lieu. Personne n'en tire un revenu, personne ne peut s'en emparer. Ce qui peut casser : une vente bloquée par la mairie après sept ans de travaux, et un groupe sommé de prouver encore son utilité. Ce qui se transmet : une association usagère renouvelée, et 1 300 donateurs qui ont appris qu'un lieu se rachète à plusieurs.
  espace-autogere-des-tanneries: |
    Ce qui tient : des assemblées d'habitants depuis 1998, le refus des subventions de fonctionnement, une ténacité apprise sous des années de menaces d'expulsion, puis un déménagement négocié plutôt que subi. On y vit et on y reçoit : concerts, ouvertures chaque semaine. Ce qui peut casser : un bail de douze ans dont le collectif lui-même jugeait le renouvellement incertain. Ce qui se transmet : les sources ne le disent pas ; on sait seulement que le groupe a survécu à un changement de murs.
  quartier-libre-des-lentilleres: |
    Ce qui tient : la bêche. Tout a commencé en 2010 par un défrichage à deux cents ; quinze ans plus tard, une centaine de personnes vivent là, entre jardins, assemblées et marché à prix libre. On a négocié une terre cultivée, pas un terrain vague. Ce qui peut casser : aucun titre signé, une convention de durée inconnue, un sol encore urbanisable, et le prix du compromis, 1,14 hectare cédé. Ce qui se transmet : non documenté ; reste à voir si l'association à créer laissera la main aux assemblées.
  la-deviation-marseille: |
    Ce qui tient : une quinzaine de membres actifs qui ont acheté leur lieu sans banque, avec des prêts solidaires, puis l'ont confié à une association où le réseau CLIP garde un veto sur la revente. Le lieu vit de cotisations, de pain, d'une guinguette à prix libre. Ce qui peut casser : le feu du 8 juillet 2025, qui a détruit ateliers, boulangerie et logements ; des statuts jamais publiés. Ce qui se transmet : la reconstruction en chantiers participatifs, et plus de cent artistes passés en résidence.
  manifesten-marseille: |
    Ce qui tient : une quinzaine de personnes, sans chef ni salarié, qui ont rouvert le café-librairie en 2016 et l'ont racheté par collecte quand les murs furent mis en vente. Le lieu sert aux autres : une quinzaine de collectifs s'y réunissent, des femmes y apprennent le français. Ce qui peut casser : le petit nombre qui tient le comptoir, une clause d'incessibilité au texte non publié. Ce qui se transmet : le lieu a déjà changé d'équipe une fois ; le réseau s'engage à en trouver une autre si celle-ci s'arrête.
  ferme-du-berquet: |
    Ce qui tient : une dizaine de personnes et une terre qui fait vivre le lieu : maraîchage en traction animale, châtaigne cultivée et transformée. Autour, une culture ouverte au pays : concerts à bas coût, résidences à prix libre pour des compagnies peu aidées. Ce qui peut casser : la propriété confiée en 2024 à un fonds dont le conseil peut encore vendre à l'unanimité, un bail de 99 ans non publié. Ce qui se transmet : non documenté ; un stage public sur le fonctionnement sans chef s'y est tenu.
  hautes-planches-bretoncelles: |
    Neuf ans : l'âge où un lieu apprend s'il tient sans l'élan de l'achat. Ce qui tient : l'association qui habite siège dans celle qui possède, avec le réseau CLIP pour second membre et un veto sur la revente. Les loyers remboursent l'emprunt ; la parcelle du Broc est venue d'une collecte. Ce qui peut casser : statuts non publiés, la protection repose sur qui siège, pas sur un acte. Comment on y décide et transmet, les sources ne le disent pas.
  longo-mai-limans: |
    Plus de cinquante ans, une centaine de personnes, pas de salaire : ce qui tient, c'est la caisse commune, l'argent de poche, la réunion hebdomadaire où l'on décide au consensus. Le lieu est resté habité après les refus de séjour de 1973 et l'opération de police de 1989. Fondateurs et générations suivantes y vivent côte à côte. Ce qui peut casser : une économie qui compte beaucoup sur les dons, et un foncier attribué selon les sources à deux fondations suisses différentes, sans acte lisible.
transversal: |
  Sur 41 fiches, onze collectifs ont fini ou changé de forme. Les trois dont la transmission n'a jamais dépassé les fondateurs sont tous morts : l'un vivait aux trois quarts des conférences de son fondateur, un autre s'est arrêté à la mort du sien, le troisième a vu le sien partir le dernier. Un lieu qui repose sur une personne part avec elle. Les quatre faillites parlent d'argent : Boimondau, la Bellevilloise, l'Essai, le premier CUN du Larzac. Guise aussi, renouvelé pendant quatre-vingts ans, s'est dissous après des années de difficultés industrielles : quand une entreprise porte le collectif, sa chute l'emporte. Ce qui dure a une relève inscrite dans le quotidien : conseils renouvelés par tiers ou par moitié, fermes libérées réattribuées à de nouveaux installés, résidences tournantes. Longo Maï et La Chapelle tiennent en décidant ensemble et sans payer personne. Limite franche : pour plus de la moitié des fiches, on ne sait pas qui prend la suite ; pour quatre sur dix, on ignore de quoi vivent les gens. C'est là qu'il faut aller écouter.
