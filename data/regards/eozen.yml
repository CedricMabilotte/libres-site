# Faces @eozen (droit des communs) — 2026-09-30. Information juridique générale, pas un conseil.
faces:
  la-chapelle-toulouse: |
    Ce qui protège : un bail emphytéotique de 40 ans (2018) sur un bien municipal. Ce droit réel reste opposable à un acquéreur du terrain s'il est publié au fichier immobilier, publication que la fiche ne confirme pas. Fragilités : la mairie exige que l'activité prouve sa conformité à l'objet du bail ; l'association signataire n'est pas vérifiée ; au terme, le bâti revient au propriétaire. P2 est franchi, mais la vente promise placerait le lieu dans une propriété associative aux statuts modifiables : sans clause publiée, le verrou reculerait.
  espace-autogere-des-tanneries: |
    Ce qui protège : une chaîne entièrement civile, un propriétaire public, et un relogement financé par la Ville (environ 1,5 M€), qui rend l'éviction politiquement coûteuse. Fragilité : un bail de 12 ans renouvelable n'est pas un titre long. À l'échéance, tout dépend d'une nouvelle décision municipale, sur un bien communal qui reste aliénable. L'échéance exacte (12 ou 13 ans) n'est pas confirmée. Pour franchir P2 : un bail emphytéotique d'au moins 30 ans consenti par la commune, reçu par un notaire et publié au fichier immobilier.
  quartier-libre-des-lentilleres: |
    Ce qui protège aujourd'hui : quinze ans de présence, un rachat municipal (2023) qui a retiré le site à l'aménageur, un compromis annoncé en 2025. En droit, presque rien : aucun titre signé confirmé, une convention de mise à disposition sans durée connue, au profit d'une association encore à créer, sur un terrain communal aliénable et classé urbanisable. Ce type de convention est souvent révocable. Pour franchir P2 : un bail emphytéotique d'au moins 30 ans, publié, ce qui suppose d'abord une personne morale signataire.
  la-deviation-marseille: |
    Ce qui protège : un achat sans prêt bancaire (2019) ; une propriétaire, Parpaing Libre, dont les deux seuls membres sont l'association usagère et le CLIP, qui détient un veto sur la revente. Fragilité : ce verrou est interne. Les statuts ne sont pas publiés, ils restent modifiables et ne sont pas opposables aux tiers. Le titre d'usage d'En Devenir est inconnu. Pour le rendre opposable : un bail emphytéotique d'au moins 30 ans publié au profit de l'usagère, ou une clause d'inaliénabilité inscrite dans un acte publié. (Lecture écrite le 30 septembre sous la règle P2 stricte, preuve de publication exigée ; depuis le 1er octobre, P2 se lit au meilleur effort documentaire et le verrou de réseau de ce lieu franchit la porte : ce qui suit dit ce qui le rendrait opposable.)
  manifesten-marseille: |
    Ce qui protège : un achat par souscription (vers 2021) au nom de New Al Dante, l'entrée dans le réseau CLIP, une clause d'incessibilité annoncée et l'engagement de confier le lieu à un autre collectif si Manifesten s'arrête. Fragilité : ni la clause ni le titre liant New Al Dante à l'usagère ne sont publiés. Une clause perpétuelle dans une acquisition se heurte à l'exigence jurisprudentielle d'une durée limitée et d'un intérêt légitime. Pour le rendre opposable : un bail emphytéotique d'au moins 30 ans publié au profit de Manifesten. (Lecture écrite le 30 septembre sous la règle P2 stricte, preuve de publication exigée ; depuis le 1er octobre, P2 se lit au meilleur effort documentaire et le verrou de réseau de ce lieu franchit la porte : ce qui suit dit ce qui le rendrait opposable.)
  ferme-du-berquet: |
    Ce qui protège : un fonds de dotation propriétaire depuis novembre 2024, sans associés ni parts. À sa dissolution, l'actif va à un autre organisme non lucratif (loi de 2008, art. 140). Fragilité : cette dévolution porte sur l'actif, pas sur le lieu ; le fonds peut vendre à l'unanimité de son conseil (Silence, 2023) ; le bail de 99 ans du modèle Antidote n'est pas publié pour ce lieu. Pour franchir P2 : ce bail emphytéotique, notarié et publié, au profit de La Faille.
  hautes-planches-bretoncelles: |
    Le montage CLIP protège le moulin par la composition des membres : l'association propriétaire Les Donnettes n'en compte que deux, l'association usagère et le réseau CLIP, qui a un droit de veto sur la revente. C'est fragile, car le verrou tient aux personnes et non à un acte publié. Les statuts n'ont pas été consultés, le titre d'usage et sa durée sont inconnus, et une association peut modifier ses statuts. Un bail écrit de longue durée et un acte publié rendant l'interdiction de revendre opposable aux tiers le consolideraient. Ces actes se passent avec un notaire et un avocat.
  longo-mai-limans: |
    Le montage sort les 270 hectares de Limans du marché : le réseau les déclare « propriété collective inaliénable » d'une fondation suisse, tandis que les coopérants gardent l'usage et décident par consensus. C'est fragile, car ni les statuts de la fondation ni l'acte qui la lie à Limans ne sont publiés. Les sources ne s'accordent pas sur la fondation propriétaire, le titre d'usage est inconnu et la forme juridique de la coopérative locale n'est pas établie. Un extrait du fichier immobilier et un titre d'usage écrit, vérifiés avec un notaire et un avocat, le consolideraient.
regle_p2: |
  Un bail emphytéotique publié est un droit réel opposable à tout acquéreur : tant qu'il court, l'aliénabilité de la propriété ne menace pas l'usage. Mais le « oui » devrait exiger la preuve de la publication, et mesurer la durée restante plutôt que la durée signée : un bail de 2018 protège jusqu'en 2058, pas au-delà. Quant à l'inaliénabilité, l'article 900-1 du Code civil ne la valide dans une libéralité que si elle est temporaire et justifiée par un intérêt sérieux et légitime, et le juge peut la lever ; la portée de la réserve faite aux personnes morales reste à vérifier. Une clause seulement statutaire lie la structure, se modifie et n'est pas publiée : elle n'est pas opposable aux tiers. Celle qui tient le mieux est stipulée dans l'acte de mutation publié.
transversal: |
  Avant 1901, sans liberté d'association, les collectifs empruntent la forme de la société : à Condé-sur-Vesgre, une anonyme par actions puis une société civile à parts, et une société à capital au Familistère. Parts cessibles, dividendes, durée limitée : aucun verrou ; terres rendues, mises en vente ou vendues en copropriété. Entre 1901 et 2008, les milieux libres restent coopératifs ou logés chez un particulier (Vaux, Aiglemont, Bascon) et finissent en faillite, dissolution ou vente. Le verrou le plus net vient de la personne publique : bail de l'État au Larzac jusqu'en 2083, Conservatoire du littoral au Rayol. La Fraternelle ne devient association propriétaire qu'en 1984. Depuis 2008, deux outils : le fonds de dotation (Antidote, Notre-Dame-des-Landes) et le veto de réseau (CLIP). Le verrou reste interne : statuts non publiés, baux de 99 ans annoncés mais introuvables. Aucun de ces cas ne franchit P2 sur pièce.
